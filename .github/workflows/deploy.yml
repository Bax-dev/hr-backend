name: Deploy backend

on:
  push:
    branches: [production, staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'prod' || 'staging' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ENV: ${{ github.ref_name == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks and tests
        env:
          DJANGO_DEBUG: 'true'
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: |
          python manage.py check
          python manage.py test
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/workiva-backend:$DEPLOY_ENV" -t "$REGISTRY/workiva-backend:${GITHUB_SHA}" .
          docker push "$REGISTRY/workiva-backend:$DEPLOY_ENV"
          docker push "$REGISTRY/workiva-backend:${GITHUB_SHA}"
      - name: Run database migrations
        run: |
          set -euo pipefail

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "workiva-$DEPLOY_ENV" \
            --services backend \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "workiva-$DEPLOY_ENV" \
            --task-definition "workiva-$DEPLOY_ENV-backend" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "workiva-$DEPLOY_ENV" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "workiva-$DEPLOY_ENV" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            STOPPED_REASON=$(aws ecs describe-tasks --cluster "workiva-$DEPLOY_ENV" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "Migration task failed (exit code $EXIT_CODE): $STOPPED_REASON"
            exit 1
          fi
      - name: Roll ECS service
        run: aws ecs update-service --cluster "workiva-$DEPLOY_ENV" --service backend --force-new-deployment
      - name: Wait for stability
        run: aws ecs wait services-stable --cluster "workiva-$DEPLOY_ENV" --services backend
